<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Habit Networks Demo UI</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { display: flex; gap: 20px; max-width: 900px; margin: 0 auto; }
        .card { background-color: #1e293b; border-radius: 8px; padding: 20px; flex: 1; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; }
        .habit-item { margin-bottom: 15px; background: #0f172a; padding: 10px; border-radius: 6px; }
        .progress-bar-bg { background: #334155; height: 12px; border-radius: 6px; overflow: hidden; margin: 8px 0; }
        .progress-bar-fill { background: #10b981; height: 100%; transition: width 0.3s; }
        button { background-color: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0369a1; }
        .node-tag { display: inline-block; background: #334155; padding: 4px 8px; border-radius: 4px; margin: 4px; }
        .edge-item { background: #0f172a; padding: 8px; border-radius: 4px; margin-bottom: 6px; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #38bdf8;">HABIT NETWORKS (Demo Dashboard)</h1>

    <div class="container">
        <!-- LEFT PANEL: PERSONAL STATS -->
        <div class="card">
            <h2>MY LOGS & STATS</h2>
            <div id="habits-list">Loading habits...</div>
            <hr style="border-color: #334155; margin: 20px 0;">
            <h3>QUICK STATS</h3>
            <p>Friends: <strong id="friends-count">-</strong></p>
            <p>Top Catalyst: <strong id="top-catalyst" style="color: #4ade80;">-</strong></p>
        </div>

        <!-- RIGHT PANEL: NETWORK GRAPH DATA -->
        <div class="card">
            <h2>NETWORK GRAPH DATA</h2>
            <h3>People (Nodes)</h3>
            <div id="nodes-list">Loading nodes...</div>
            
            <h3 style="margin-top: 20px;">Connections (Edges)</h3>
            <div id="edges-list">Loading edges...</div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        // 1. Fetch Stats from Backend (GET /api/user/stats)
        async function loadUserStats() {
            const res = await fetch(`${API_URL}/api/user/stats`);
            const data = await res.json();

            document.getElementById("friends-count").innerText = data.quick_stats.friends_count;
            document.getElementById("top-catalyst").innerText = data.quick_stats.top_catalyst;

            const habitsContainer = document.getElementById("habits-list");
            habitsContainer.innerHTML = "";

            data.habits.forEach(habit => {
                habitsContainer.innerHTML += `
                    <div class="habit-item">
                        <strong>${habit.title}</strong> - ${habit.progress}%
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${habit.progress}%"></div>
                        </div>
                        <button onclick="logHabit('${habit.id}')">+ Log Progress</button>
                    </div>
                `;
            });
        }

        // 2. Fetch Graph Data from Backend (GET /api/network-graph)
        async function loadNetworkGraph() {
            const res = await fetch(`${API_URL}/api/network-graph`);
            const data = await res.json();

            const nodesContainer = document.getElementById("nodes-list");
            nodesContainer.innerHTML = data.nodes.map(n => `<span class="node-tag">👤 ${n.label}</span>`).join("");

            const edgesContainer = document.getElementById("edges-list");
            edgesContainer.innerHTML = data.edges.map(e => `
                <div class="edge-item">
                    <strong>${e.source.toUpperCase()}</strong> ──[${e.score}]──> <strong>${e.target.toUpperCase()}</strong>
                </div>
            `).join("");
        }

        // 3. Send New Log to Backend (POST /api/habits/log)
        async function logHabit(habitId) {
            await fetch(`${API_URL}/api/habits/log`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ habit_id: habitId })
            });
            // Reload stats immediately after logging!
            loadUserStats();
        }

        // Run both on page load
        loadUserStats();
        loadNetworkGraph();
    </script>
</body>
</html>
